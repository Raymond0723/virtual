version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: shellusion-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro 
    depends_on:
      - ttyd
      - api
    restart: always


  ttyd:
    image: tsbrain/ttyd:latest
    container_name: shellusion-ttyd
    environment:
      - TTYD_USER=ubuntu
      - TTYD_PASS=ubuntu
    command: ttyd -W bash
    restart: always


  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: shellusion-api
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always